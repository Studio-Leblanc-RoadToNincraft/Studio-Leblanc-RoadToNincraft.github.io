<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur d'Âge RP | Studio Leblanc</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Calculateur d'Âge RP</h1>
        <h4>Road to nincraft | Studio Leblanc</h2>

        <label for="annee">Année de création du personnage :</label>
        <input type="number" id="annee" placeholder="2024"><br>

        <label for="mois">Mois de création du personnage :</label>
        <select id="mois">
            <option value="0">Janvier</option>
            <option value="1">Février</option>
            <option value="2">Mars</option>
            <option value="3">Avril</option>
            <option value="4">Mai</option>
            <option value="5">Juin</option>
            <option value="6">Juillet</option>
            <option value="7">Août</option>
            <option value="8">Septembre</option>
            <option value="9">Octobre</option>
            <option value="10">Novembre</option>
            <option value="11">Décembre</option>
        </select><br>

        <label for="jour">Jour de création du personnage :</label>
        <input type="number" id="jour" placeholder="5"><br>

        <label for="age">Âge RP à la création :</label>
        <input type="number" id="age" placeholder="10"><br>

        <button id="submit">Calculer l'Âge RP</button>

        <div id="resultat"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
